name: Feature request
description: Propose an offline artifact analysis or reporting improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Detection or workflow problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed artifact-only solution
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Offline boundary
      options:
        - label: This proposal does not require live host, process, memory, registry, service, driver, or network access.
          required: true
